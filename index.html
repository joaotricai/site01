<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#202127"><title>Conecta — Comunidade</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#e6e7ed;background:#202127}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #8797ff;outline-offset:2px}.app{display:grid;grid-template-columns:72px 240px minmax(0,1fr);height:100dvh;overflow:hidden}.rail{background:#17181d;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:12px}.logo,.server{width:48px;height:48px;border-radius:17px;display:grid;place-items:center;background:#34363f;color:#fff;font-weight:800;font-size:20px;transition:.2s}.logo{background:#6575f4}.server:hover,.server.active{border-radius:14px;background:#6575f4}.addserver{color:#4bd5a3}.sidebar{background:#292b33;display:flex;flex-direction:column;min-width:0}.sidehead{height:60px;display:flex;align-items:center;padding:0 16px;font-weight:750;border-bottom:1px solid #1d1e24;gap:8px}.search{background:#1c1d23;color:#b8bac5;border-radius:5px;padding:9px 10px;font-size:12px;width:100%;text-align:left}.sidebody{padding:16px 9px;overflow:auto;flex:1}.sectionhead{display:flex;justify-content:space-between;color:#a3a5b1;font-size:11px;font-weight:800;letter-spacing:.05em;padding:12px 10px}.navitem{display:flex;align-items:center;gap:12px;padding:12px;border-radius:7px;color:#b9bbc8;width:100%;text-align:left;background:transparent;font-size:14px}.navitem:hover,.navitem.selected{background:#3c3f49;color:#fff}.avatar{height:36px;width:36px;flex:0 0 36px;border-radius:50%;background:#6575f4;display:grid;place-items:center;color:#fff;font-weight:700;position:relative}.avatar:after{content:'';position:absolute;bottom:-1px;right:-1px;border:3px solid #292b33;background:#3cdb93;width:10px;height:10px;border-radius:50%}.userbar{background:#22242b;padding:10px;display:flex;align-items:center;gap:8px}.username{font-size:13px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.muted{font-size:11px;color:#a4a7b3}.iconbtn{background:transparent;padding:7px;border-radius:7px;color:#b6b9c7}.iconbtn:hover{background:#41434f;color:#fff}.grow{flex:1;min-width:0}.main{display:flex;flex-direction:column;min-width:0;background:#31333d}.topbar{height:60px;border-bottom:1px solid #262832;display:flex;align-items:center;gap:14px;padding:0 22px;flex-shrink:0}.topbar h2{font-size:15px;margin:0}.topbar .hint{color:#a6a8b5;font-size:12px;border-left:1px solid #515360;padding-left:14px}.primary{background:#6273ec;border-radius:6px;padding:9px 14px;font-weight:700;font-size:12px}.primary:hover{background:#7c8af5}.secondary{background:#454853;border-radius:6px;padding:9px 13px;font-size:12px}.content{flex:1;min-height:0;overflow:auto;padding:25px}.welcome{max-width:800px;margin:25px auto}.welcome h1{font-size:29px;margin:0 0 8px}.welcome p{color:#b5b7c3;font-size:14px;line-height:1.6}.panel{background:#292b34;border-radius:12px;padding:20px;margin:18px 0}.panel h3{margin:0 0 14px;font-size:15px}.friendrow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #3c3e49}.friendrow:last-child{border:0}.friendrow .grow strong{display:block;font-size:13px}.friendrow .grow small{color:#a4a7b3}.empty{color:#a4a7b3;font-size:13px;padding:16px 0}.chat{display:flex;flex-direction:column;height:100%;min-height:0}.messages{flex:1;overflow:auto;padding:24px}.msg{display:flex;gap:12px;margin:17px 0}.msg strong{font-size:13px}.msg time{font-size:10px;color:#8d909e;margin-left:10px}.msg p{font-size:14px;color:#d3d5df;margin:5px 0;overflow-wrap:anywhere}.composer{padding:14px 22px 24px;display:flex;gap:10px}.composer input{background:#444751;border:0;border-radius:8px;color:#fff;padding:15px;flex:1;min-width:0}.composer button{border-radius:8px}.overlay{position:fixed;inset:0;background:#0d0e13b8;display:grid;place-items:center;z-index:20;padding:16px}.modal{width:min(490px,100%);max-height:90vh;overflow:auto;background:#30323c;padding:25px;border-radius:14px;box-shadow:0 25px 80px #0008}.modal h2{margin:0 0 8px;font-size:22px}.modal p{color:#b4b6c2;font-size:13px;line-height:1.6}.field{display:block;color:#bfc1ce;font-size:12px;font-weight:750;margin:18px 0 7px}.modal input,.modal select{width:100%;background:#202127;border:1px solid #51535f;color:#fff;border-radius:7px;padding:12px}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.call{background:#191b22;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;height:100%;text-align:center;padding:25px}.call h2{margin:0}.call p{color:#a8abb7}.callavatar{width:100px;height:100px;font-size:40px;border-radius:32px}.callbuttons{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.round{height:54px;width:54px;border-radius:50%;background:#41444f;font-size:23px}.round.off{background:#a83849}.round.end{background:#e34658}.preview{max-width:min(600px,100%);max-height:40vh;border-radius:10px;background:#090a0d}.notice{position:fixed;right:20px;bottom:20px;background:#17191f;border:1px solid #565966;border-radius:9px;padding:13px 18px;font-size:13px;z-index:30;max-width:350px}.tag{font-size:11px;color:#aeb2c1;background:#3d4050;padding:4px 7px;border-radius:5px}.mobilemenu{display:none}@media(max-width:750px){.app{grid-template-columns:55px minmax(0,1fr)}.rail{padding:12px 4px}.logo,.server{width:42px;height:42px}.sidebar{display:none}.sidebar.show{display:flex;position:fixed;z-index:10;top:0;bottom:0;left:55px;width:240px;box-shadow:10px 0 40px #0008}.topbar{padding:0 12px;gap:8px}.topbar .hint{display:none}.mobilemenu{display:block}.content{padding:16px}.welcome h1{font-size:24px}.topbar h2{font-size:13px}.messages{padding:15px}.composer{padding:12px}} 
</style></head><body><div id="root"></div><script>
const KEY='conecta-v1';const initial={name:'Meu usuário',tag:'usuario',friends:[],messages:{},servers:['Meu servidor'],channels:['geral','bate-papo','ideias']};let state;try{state={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state={...initial}};let view='friends',activeFriend='',activeChannel='geral',modal='',calling=false,micStream=null,screenStream=null,muted=false,deafened=false,mobileOpen=false,noticeTimer=null;
const root=document.getElementById('root');const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const initials=s=>String(s||'?').slice(0,2).toUpperCase();function toast(t){document.querySelector('.notice')?.remove();let el=document.createElement('div');el.className='notice';el.textContent=t;document.body.append(el);clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>el.remove(),4000)}function btn(label,action,cls='iconbtn'){return '<button class="'+cls+'" data-action="'+action+'">'+label+'</button>'}function currentTitle(){return view==='friends'?'Amigos':view==='chat'?'@ '+activeFriend:view==='channel'?'# '+activeChannel:'Configurações'}
function render(){root.innerHTML='<div class="app"><aside class="rail"><button class="logo" data-action="home" title="Início">C</button>'+state.servers.map((s,i)=>'<button class="server '+(view==='channel'&&i===0?'active':'')+'" data-action="server" data-value="'+i+'" title="'+esc(s)+'">'+initials(s)+'</button>').join('')+'<button class="server addserver" data-action="addserver" title="Criar servidor">+</button></aside><aside class="sidebar '+(mobileOpen?'show':'')+'"><div class="sidehead">'+(view==='channel'?'Meu servidor':'<button class="search" data-action="search">Encontre ou inicie uma conversa</button>')+'</div><div class="sidebody">'+(view==='channel'?'<div class="sectionhead">CANAIS DE TEXTO '+btn('+','addchannel')+'</div>'+state.channels.map(c=>'<button class="navitem '+(activeChannel===c?'selected':'')+'" data-action="channel" data-value="'+esc(c)+'"># '+esc(c)+'</button>').join(''):'<button class="navitem '+(view==='friends'?'selected':'')+'" data-action="home">☻ &nbsp; Amigos</button><div class="sectionhead">MENSAGENS DIRETAS '+btn('+','addfriend')+'</div>'+state.friends.map(f=>'<button class="navitem '+(activeFriend===f&&view==='chat'?'selected':'')+'" data-action="openfriend" data-value="'+esc(f)+'"><span class="avatar">'+initials(f)+'</span>'+esc(f)+'</button>').join(''))+'</div><div class="userbar"><div class="avatar">'+initials(state.name)+'</div><div class="grow"><div class="username">'+esc(state.name)+'</div><div class="muted">@'+esc(state.tag)+'</div></div>'+btn('⚙','settings')+'</div></aside><main class="main"><header class="topbar">'+btn('☰','menu','iconbtn mobilemenu')+'<h2>'+esc(currentTitle())+'</h2><span class="hint">'+(view==='friends'?'Gerencie seus contatos':view==='channel'?'Canal de texto':'Conversas e comunidade')+'</span><div class="grow"></div>'+(view==='friends'?btn('+ Adicionar amigo','addfriend','primary'):view==='chat'?btn('☎ Ligar','call','primary'):'')+'</header><div class="'+(view==='chat'||view==='channel'?'chat':'content')+'">'+(calling?callHTML():view==='friends'?friendsHTML():view==='chat'?chatHTML('dm:'+activeFriend):view==='channel'?chatHTML('channel:'+activeChannel):friendsHTML())+'</div></main></div>'+modalHTML();if(view==='chat'||view==='channel'){let m=document.querySelector('.messages');if(m)m.scrollTop=m.scrollHeight}}
function friendsHTML(){return '<div class="welcome"><h1>Seu espaço para conversar.</h1><p>Adicione amigos, organize conversas e personalize seu perfil. Esta versão salva os dados neste navegador; a sincronização entre pessoas ainda não está ativada.</p><div class="panel"><h3>Seus amigos <span class="tag">'+state.friends.length+'</span></h3>'+(state.friends.length?state.friends.map(f=>'<div class="friendrow"><div class="avatar">'+initials(f)+'</div><div class="grow"><strong>'+esc(f)+'</strong><small>Contato salvo neste dispositivo</small></div>'+btn('Mensagem','openfriend:'+f,'secondary')+btn('Remover','remove:'+f)+'</div>').join(''):'<div class="empty">Sua lista está vazia. Adicione um nome para começar.</div>')+'</div><div class="panel"><h3>Comunidade</h3><p style="color:#aeb0bc;font-size:13px">Acesse os canais do seu servidor na barra lateral para organizar suas ideias e mensagens.</p>'+btn('Abrir servidor','server','primary')+'</div></div>'}
function chatHTML(key){let msgs=state.messages[key]||[];return '<div class="messages">'+(msgs.length?msgs.map(m=>'<div class="msg"><div class="avatar">'+initials(m.author)+'</div><div><strong>'+esc(m.author)+'</strong><time>'+esc(m.time)+'</time><p>'+esc(m.text)+'</p></div></div>').join(''):'<div class="welcome"><h1>'+esc(view==='channel'?'# '+activeChannel:activeFriend)+'</h1><p>Este é o início da conversa. Mensagens nesta versão ficam armazenadas somente neste navegador.</p></div>')+'</div><form class="composer" id="messageform"><input name="message" maxlength="2000" autocomplete="off" placeholder="Enviar mensagem..." required><button class="primary">Enviar</button></form>'}
function callHTML(){return '<div class="call"><div class="avatar callavatar">'+initials(activeFriend)+'</div><div><h2>'+esc(activeFriend)+'</h2><p>Modo de teste local — não há conexão com outra pessoa.</p></div><video id="screenPreview" class="preview" autoplay muted playsinline style="display:'+(screenStream?'block':'none')+'"></video><div class="callbuttons"><button class="round '+(muted?'off':'')+'" data-action="mic" title="Microfone">'+(muted?'🔇':'🎙')+'</button><button class="round '+(deafened?'off':'')+'" data-action="deafen" title="Silenciar áudio">🎧</button><button class="round" data-action="screen" title="Compartilhar tela localmente">▣</button><button class="round end" data-action="endcall" title="Encerrar">✕</button></div><p style="font-size:12px">Você pode testar permissões e pré-visualizar sua tela. Para conversar ou transmitir a amigos, precisamos conectar um serviço de chamadas.</p></div>'}
function modalHTML(){if(!modal)return '';let body=modal==='addfriend'?'<h2>Adicionar amigo</h2><p>Cadastre um contato na sua lista local. O convite real entre contas estará disponível após integrar um servidor.</p><label class="field">Nome do amigo</label><input id="field" maxlength="32" placeholder="Ex.: joao">':modal==='settings'?'<h2>Configurações da conta</h2><p>Personalize seu perfil neste dispositivo.</p><label class="field">Nome de exibição</label><input id="field" maxlength="32" value="'+esc(state.name)+'"><label class="field">Nome de usuário</label><input id="tag" maxlength="32" value="'+esc(state.tag)+'"><label class="field">Microfone</label><select id="device"><option value="">Padrão do navegador</option></select><div style="margin-top:12px">'+btn('Testar microfone','testmic','secondary')+'</div>':modal==='addserver'?'<h2>Criar servidor</h2><p>Adicione um espaço visual à barra lateral.</p><label class="field">Nome do servidor</label><input id="field" maxlength="32" placeholder="Meu servidor">':modal==='addchannel'?'<h2>Criar canal</h2><label class="field">Nome do canal</label><input id="field" maxlength="32" placeholder="novo-canal">':'<h2>Buscar conversa</h2><p>Escolha um amigo da sua lista ou adicione um novo contato.</p><label class="field">Nome</label><input id="field" maxlength="32" placeholder="Nome do amigo">';return '<div class="overlay" data-action="close"><form class="modal" id="modalform" onclick="event.stopPropagation()">'+body+'<div class="actions">'+btn('Cancelar','close','secondary')+'<button class="primary">Salvar</button></div></form></div>'}
async function startMic(){try{micStream?.getTracks().forEach(t=>t.stop());let device=document.querySelector('#device')?.value;micStream=await navigator.mediaDevices.getUserMedia({audio:device?{deviceId:{exact:device}}:true});toast('Microfone autorizado e disponível.');let devices=await navigator.mediaDevices.enumerateDevices();let sel=document.querySelector('#device');if(sel){sel.innerHTML='<option value="">Padrão do navegador</option>'+devices.filter(d=>d.kind==='audioinput').map(d=>'<option value="'+esc(d.deviceId)+'">'+esc(d.label||'Microfone')+'</option>').join('');if(device)sel.value=device}}catch(e){toast('Não foi possível acessar o microfone: '+e.message)}}
function stopMedia(){micStream?.getTracks().forEach(t=>t.stop());screenStream?.getTracks().forEach(t=>t.stop());micStream=null;screenStream=null}
async function shareScreen(){if(screenStream){screenStream.getTracks().forEach(t=>t.stop());screenStream=null;render();return}try{screenStream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});screenStream.getVideoTracks()[0].onended=()=>{screenStream=null;render()};render();let v=document.querySelector('#screenPreview');if(v){v.srcObject=screenStream;v.play().catch(()=>{})}toast('Prévia da tela ativa somente neste dispositivo.')}catch(e){toast('Compartilhamento cancelado ou indisponível.')}}
function playTone(){try{let ctx=new (window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=440;g.gain.value=.035;o.start();o.stop(ctx.currentTime+.18);o.onended=()=>ctx.close()}catch{}}
root.addEventListener('click',async e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,v=b.dataset.value||'';if(a==='menu'){mobileOpen=!mobileOpen;render();return}if(a==='close'){modal='';render();return}if(a==='home'){view='friends';calling=false;mobileOpen=false}if(a==='server'){view='channel';calling=false;mobileOpen=false}if(a==='channel'){view='channel';activeChannel=v;calling=false;mobileOpen=false}if(a==='openfriend'||a.startsWith('openfriend:')){activeFriend=a==='openfriend'?v:a.split(':').slice(1).join(':');view='chat';calling=false;mobileOpen=false}if(a==='remove:'+v||a.startsWith('remove:')){let f=a.slice(7);state.friends=state.friends.filter(x=>x!==f);save()}if(['addfriend','settings','addserver','addchannel','search'].includes(a)){modal=a;render();if(a==='settings'&&navigator.mediaDevices?.enumerateDevices){navigator.mediaDevices.enumerateDevices().then(ds=>{let sel=document.querySelector('#device');if(sel)sel.innerHTML='<option value="">Padrão do navegador</option>'+ds.filter(d=>d.kind==='audioinput').map(d=>'<option value="'+esc(d.deviceId)+'">'+esc(d.label||'Microfone')+'</option>').join('')}).catch(()=>{})}return}if(a==='testmic'){await startMic();return}if(a==='call'){calling=true;muted=false;deafened=false;playTone();toast('Chamada de demonstração: sem conexão com outro usuário.')}if(a==='endcall'){calling=false;stopMedia()}if(a==='mic'){muted=!muted;if(!micStream&&!muted)await startMic();micStream?.getAudioTracks().forEach(t=>t.enabled=!muted)}if(a==='deafen'){deafened=!deafened;toast(deafened?'Áudio local silenciado':'Áudio local ativado')}if(a==='screen'){await shareScreen();return}render();if(calling&&screenStream){let el=document.querySelector('#screenPreview');if(el){el.srcObject=screenStream;el.play().catch(()=>{})}}});
root.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='messageform'){let input=e.target.elements.message;let text=input.value.trim();if(!text)return;let key=view==='channel'?'channel:'+activeChannel:'dm:'+activeFriend;(state.messages[key]??=[]).push({author:state.name,text,time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});save();render();return}if(e.target.id==='modalform'){let val=document.querySelector('#field')?.value.trim()||'';if(modal==='settings'){state.name=val||'Meu usuário';state.tag=(document.querySelector('#tag')?.value||'usuario').trim().replace(/[^a-zA-Z0-9_.-]/g,'').toLowerCase()||'usuario'}if(modal==='addfriend'||modal==='search'){if(val&&!state.friends.includes(val))state.friends.push(val);else if(!val){toast('Digite um nome.');return}}if(modal==='addserver'&&val)state.servers.push(val);if(modal==='addchannel'&&val&&!state.channels.includes(val))state.channels.push(val.toLowerCase().replace(/\s+/g,'-'));save();modal='';render();toast('Salvo neste navegador.')}});window.addEventListener('beforeunload',stopMedia);render();
</script></body></html>
